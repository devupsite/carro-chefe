<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Carro Chefe · Arquitetura de Oferta 2025</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --preto:#181310;--carvao:#28201A;--carvao2:#221A14;
  --offwhite:#F5F0E8;--areia:#E0D5C5;--areia-esc:#C4B49A;
  --tijolo:#C94B2C;--tijolo-d:rgba(201,75,44,.15);
  --cinza:#9A8F85;--musgo:#4A6040;--linha:#3a2e22;
  --an:#C94B2C;--pr:#4A6040;--dc:#9A8F85;--fm:#C4B49A;
}
html,body{height:100%}
body{font-family:'Poppins',sans-serif;background:var(--preto);color:var(--offwhite);overflow-x:hidden}

/* HEADER */
header{
  background:var(--preto);padding:24px 52px 20px;
  display:flex;align-items:flex-end;justify-content:space-between;
  border-bottom:1px solid var(--tijolo);position:sticky;top:0;z-index:100;
}
.h-sub{font-size:8px;letter-spacing:4px;color:var(--tijolo);text-transform:uppercase;margin-bottom:5px}
.h-title{font-family:'Lora',serif;font-size:20px;font-weight:400;color:var(--offwhite)}
.h-right{text-align:right}
.h-tag{font-size:8px;letter-spacing:3px;color:var(--cinza);text-transform:uppercase;line-height:1.8}

/* TABS */
.tabs{
  display:flex;border-bottom:1px solid var(--linha);padding:0 52px;
  background:var(--preto);overflow-x:auto;position:sticky;top:65px;z-index:99;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tb{
  background:none;border:none;border-bottom:2px solid transparent;
  padding:17px 24px 15px;cursor:pointer;margin-bottom:-1px;
  flex-shrink:0;transition:all .2s;font-family:'Poppins',sans-serif;
  font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--cinza);
}
.tb:hover{color:var(--areia-esc)}
.tb.on{color:var(--tijolo);border-bottom-color:var(--tijolo)}

/* MAIN */
main{padding:52px 52px 100px;max-width:1120px}
.panel{display:none;animation:fu .35s ease}
.panel.on{display:block}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* UTILS */
.sec-hd{display:flex;align-items:center;gap:16px;margin-bottom:24px;margin-top:44px}
.sec-hd:first-child{margin-top:0}
.sec-lb{font-size:7px;letter-spacing:4px;text-transform:uppercase;color:var(--cinza);white-space:nowrap}
.sec-ln{flex:1;height:1px;background:var(--linha)}

.insight{background:var(--carvao);border-left:3px solid var(--tijolo);padding:18px 22px;margin-bottom:32px}
.ins-l{font-size:7px;letter-spacing:3px;color:var(--tijolo);text-transform:uppercase;margin-bottom:6px}
.ins-t{font-family:'Lora',serif;font-size:13px;color:var(--areia-esc);font-style:italic;line-height:1.7}

/* TIER */
.tier-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.tier-badge{font-size:7px;letter-spacing:3px;text-transform:uppercase;padding:4px 12px;border:1px solid}
.tier-line{flex:1;height:1px;background:var(--linha)}

/* PACK CARDS */
.pack-grid{display:grid;gap:1px;background:var(--linha);margin-bottom:16px}
.pack-grid.cols2{grid-template-columns:1fr 1fr}
.pack{
  background:var(--carvao);padding:30px 26px;
  position:relative;overflow:hidden;border-top:3px solid var(--pc);
  transition:background .2s;
}
.pack:hover{background:#2a201a}
.pack-icon{font-size:24px;margin-bottom:16px}
.pack-nome{font-family:'Lora',serif;font-size:18px;font-weight:400;color:var(--offwhite);margin-bottom:8px}
.pack-desc{font-size:10px;color:var(--cinza);line-height:1.75;margin-bottom:18px}
.pi-l{font-size:7px;letter-spacing:3px;text-transform:uppercase;color:var(--cinza);margin-bottom:8px}
.pi-item{display:flex;align-items:flex-start;gap:7px;padding:4px 0;border-bottom:1px solid var(--linha)}
.pi-item:last-child{border-bottom:none}
.pi-d{width:3px;height:3px;border-radius:50%;flex-shrink:0;margin-top:6px}
.pi-t{font-size:9px;color:var(--areia-esc);line-height:1.55}
.pack-inclui{margin-bottom:20px}
.pp-l{font-size:7px;letter-spacing:3px;text-transform:uppercase;color:var(--cinza);margin-bottom:8px}
.pp-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pp-item{background:var(--preto);padding:9px 11px}
.pp-dia{font-size:7px;letter-spacing:2px;text-transform:uppercase;color:var(--cinza);margin-bottom:3px}
.pp-val{font-family:'Lora',serif;font-size:15px;color:var(--offwhite)}
.pp-val.modelo{color:var(--areia-esc)}
.pp-flag{font-family:'Poppins',sans-serif;font-size:7px;color:var(--cinza);display:block;margin-top:2px}
.pack-preco{margin-bottom:18px}
.pack-tag{
  display:inline-flex;align-items:center;gap:5px;
  border:1px solid;padding:4px 12px;
  font-size:7px;letter-spacing:2px;text-transform:uppercase;margin-top:12px;
}
.pack-why{font-size:9px;color:var(--cinza);line-height:1.65;margin-top:14px;padding-top:12px;border-top:1px solid var(--linha);font-style:italic}

/* ENTRADA */
.entrada-wrap{display:flex;flex-direction:column;gap:1px;background:var(--linha);margin-bottom:36px}
.entrada-row{background:var(--carvao);display:grid;grid-template-columns:200px 1fr 1fr;gap:0}
.er-c{padding:20px 22px;border-right:1px solid var(--linha);display:flex;flex-direction:column;justify-content:center}
.er-c:last-child{border-right:none}
.er-l{font-size:7px;letter-spacing:3px;text-transform:uppercase;color:var(--cinza);margin-bottom:6px}
.er-persona{font-family:'Lora',serif;font-size:14px;color:var(--offwhite);margin-bottom:3px}
.er-role{font-size:9px;color:var(--cinza)}
.er-entrada{font-size:11px;color:var(--offwhite);font-weight:500;margin-bottom:5px}
.er-txt{font-size:9px;color:var(--cinza);line-height:1.65}
.er-exp{font-size:9px;color:var(--areia-esc);line-height:1.65}

/* SPACE */
.space-hero{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--linha);margin-bottom:36px}
.sh-card{background:var(--carvao);padding:24px 20px;position:relative;overflow:hidden}
.sh-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--tijolo)}
.shc-l{font-size:7px;letter-spacing:3px;text-transform:uppercase;color:var(--cinza);margin-bottom:10px}
.shc-v{font-family:'Lora',serif;font-size:26px;color:var(--offwhite);line-height:1;margin-bottom:4px}
.shc-s{font-size:9px;color:var(--cinza);line-height:1.5}

.inclui-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--linha);margin-bottom:36px}
.inc-card{background:var(--carvao);padding:22px 20px}
.inc-icon{font-size:20px;margin-bottom:12px}
.inc-nome{font-family:'Lora',serif;font-size:13px;color:var(--offwhite);margin-bottom:6px}
.inc-desc{font-size:9px;color:var(--cinza);line-height:1.65}

.tech-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--linha);margin-bottom:36px}
.tech-blk{background:var(--preto);padding:24px 26px}
.tech-l{font-size:7px;letter-spacing:4px;text-transform:uppercase;color:var(--tijolo);margin-bottom:14px}
.tech-item{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid var(--linha)}
.tech-item:last-child{border-bottom:none}
.tech-d{width:4px;height:4px;border-radius:50%;background:var(--tijolo);flex-shrink:0;margin-top:5px}
.tech-t{font-size:10px;color:var(--areia-esc);line-height:1.6}

/* ADD-ONS */
.addon-list{display:flex;flex-direction:column;gap:1px;background:var(--linha);margin-bottom:24px}
.addon{background:var(--carvao)}
.addon-h{
  display:grid;grid-template-columns:1fr auto;align-items:center;
  gap:16px;padding:20px 24px;cursor:pointer;transition:background .2s;
  border-left:3px solid transparent;
}
.addon-h:hover{background:#2a201a}
.addon-h.open{border-left-color:var(--tijolo);background:var(--carvao2)}
.ah-nome{font-family:'Lora',serif;font-size:14px;color:var(--offwhite)}
.ah-sub{font-size:9px;color:var(--cinza);margin-top:2px}
.ah-right{text-align:right;flex-shrink:0}
.ah-preco{font-family:'Lora',serif;font-size:16px;color:var(--tijolo)}
.ah-preco.modelo{color:var(--areia-esc)}
.ah-flag{font-size:7px;color:var(--cinza);font-style:italic;margin-top:1px}
.addon-body{display:none;padding:0 24px 22px;animation:fu .2s ease}
.addon-body.open{display:block}
.ab-desc{font-size:10px;color:var(--cinza);line-height:1.75;margin-bottom:12px}
.ab-tip{font-size:9px;color:var(--areia-esc);font-style:italic;border-left:2px solid var(--tijolo);padding-left:10px;line-height:1.6}

/* SHOW MODELS */
.show-models{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--linha);margin-bottom:36px}
.sm-card{padding:28px 26px}
.sm-card.a{background:var(--carvao)}
.sm-card.b{background:var(--carvao2)}
.sm-l{font-size:7px;letter-spacing:4px;text-transform:uppercase;color:var(--tijolo);margin-bottom:10px;opacity:.8}
.sm-nome{font-family:'Lora',serif;font-size:17px;color:var(--offwhite);margin-bottom:14px}
.sm-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--linha)}
.sm-row:last-child{border-bottom:none}
.sm-k{font-size:9px;color:var(--cinza)}
.sm-v{font-size:10px;color:var(--areia-esc);font-weight:500;text-align:right}
.sm-note{font-size:9px;color:var(--cinza);line-height:1.65;margin-top:14px;padding-top:12px;border-top:1px solid var(--linha);font-style:italic}

/* JOURNEY */
.fases-wrap{display:flex;flex-direction:column;gap:1px;background:var(--linha)}
.fase-row{background:var(--carvao);display:grid;grid-template-columns:200px 1fr 1fr;gap:0}
.fase-row.critica{background:linear-gradient(90deg,#2e1812,var(--carvao) 60%)}
.fr-n{padding:24px;border-right:1px solid var(--linha);display:flex;flex-direction:column;justify-content:center}
.fn-num{font-size:8px;letter-spacing:3px;text-transform:uppercase;color:var(--tijolo);opacity:.7;margin-bottom:5px}
.fn-nome{font-family:'Lora',serif;font-size:14px;color:var(--offwhite)}
.fn-critico{display:inline-block;font-size:7px;letter-spacing:2px;text-transform:uppercase;background:var(--tijolo);color:var(--offwhite);padding:2px 8px;margin-top:10px}
.fr-o{padding:22px 24px;border-right:1px solid var(--linha)}
.fr-c{padding:22px 24px}
.fr-l{font-size:7px;letter-spacing:3px;text-transform:uppercase;color:var(--cinza);margin-bottom:8px}
.fr-t{font-size:10px;color:var(--areia-esc);line-height:1.75}
.fr-nota{font-size:9px;color:var(--cinza);line-height:1.65;font-style:italic;margin-top:10px;padding-top:10px;border-top:1px solid var(--linha)}

/* ALERT */
.alerta{
  background:var(--carvao2);border:1px solid var(--tijolo);
  padding:18px 22px;margin-bottom:28px;
  display:flex;gap:14px;align-items:flex-start;
}
.alert-icon{font-size:18px;flex-shrink:0}
.alert-l{font-size:8px;letter-spacing:3px;color:var(--tijolo);text-transform:uppercase;margin-bottom:5px}
.alert-t{font-family:'Lora',serif;font-size:12px;color:var(--areia-esc);line-height:1.7;font-style:italic}

/* SCROLLBAR */
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--linha);border-radius:2px}

/* RESPONSIVE */
@media(max-width:860px){
  header,main,.tabs{padding-left:24px;padding-right:24px}
  .pack-grid.cols2,.show-models,.space-hero,.tech-grid,.inclui-grid{grid-template-columns:1fr}
  .entrada-row,.fase-row{grid-template-columns:1fr}
  .er-c,.fr-n,.fr-o{border-right:none;border-bottom:1px solid var(--linha)}
  .pp-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<header>
  <div>
    <div class="h-sub">Carro Chefe</div>
    <div class="h-title">Arquitetura de Oferta</div>
  </div>
  <div class="h-right">
    <div class="h-tag">Uso Interno · UP Agência</div>
    <div class="h-tag">Estratégia · 2025</div>
  </div>
</header>

<div class="tabs">
  <button class="tb on"  onclick="goTab('pacotes',this)">Pacotes de Evento</button>
  <button class="tb"     onclick="goTab('espaco',this)">O Espaço</button>
  <button class="tb"     onclick="goTab('addons',this)">Personalizações</button>
  <button class="tb"     onclick="goTab('experiencia',this)">Experiência de Contratação</button>
</div>

<main>
  <div class="panel on" id="tab-pacotes"></div>
  <div class="panel"    id="tab-espaco"></div>
  <div class="panel"    id="tab-addons"></div>
  <div class="panel"    id="tab-experiencia"></div>
</main>

<script>
/* ── DATA ─────────────────────────────────────────────────────── */

  },
  { tier:1, icon:'🎵', nome:'Show & Noite Temática', pc:'var(--pr)',
    persona:'O Produtor de Show', tag:'Visibilidade & Alcance',

      'Suporte on-site dedicado com briefing prévio',

    precos:[

      {dia:'Sexta-feira',val:'R$ 13.500',modelo:true},

      {dia:'Domingo',val:'R$ 12.000',modelo:true},

  { tier:2, icon:'🎓', nome:'Formatura & Colação', pc:'var(--fm)',
    persona:'Mix · Formandos & Famílias', tag:'Sazonalidade Previsível',
    desc:'Festas de conclusão de cursos técnicos, graduações e pós. Sazonalidade previsível, público jovem e alta documentação em foto e vídeo — o que gera conteúdo orgânico extenso.',
    inclui:[
      'Espaço exclusivo para cerimônia + festa (transição de layout inclusa)',
      'Serviço de bar para recepção e festa',
      'Estrutura de som e microfone sem fio para discursos',
      'Mesas e cadeiras para até 100 convidados',
      'Área de coquetel/recepção configurada separadamente',
      'Suporte on-site durante toda a programação',
    ],
    precos:[
      {dia:'Seg – Qui',val:'R$ 10.000',modelo:false},
      {dia:'Sexta-feira',val:'R$ 13.500',modelo:true},
      {dia:'Sábado',val:'R$ 17.000',modelo:true},
      {dia:'Domingo',val:'R$ 12.000',modelo:true},

const ENTRADAS = [
  { persona:'A Anfitriã', c:'var(--an)', role:'28–52 anos · Zona Leste',

    entrada:'Show & Noite Temática',

  { persona:'O Decisor Corporativo', c:'var(--dc)', role:'30–55 anos · Sócio ou responsável por RH',

    expansao:'Recorrência anual → Indica para fornecedores e parceiros → Ticket cresce com add-ons como open bar premium e AV'
  }
];

const INCLUI_PADRAO = [
  {icon:'🏛',nome:'Espaço Exclusivo',desc:'Uso total do espaço pelo período contratado. Nenhum outro evento simultâneo — privacidade garantida.'},
  {icon:'🎙',nome:'Estrutura de Som',desc:'PA, microfone (com e sem fio) e DI inclusos em todos os pacotes. Técnico disponível para configuração.'},
  {icon:'🍸',nome:'Serviço de Bar',desc:'Bar operando durante todo o evento. Modelo de consumação ou open bar — definido na proposta de cada evento.'},

  {icon:'🤝',nome:'Suporte On-site',desc:'Equipe Carro Chefe presente durante todo o evento. Coordenação, resolução de imprevistos e ponto de contato único.'},
  {icon:'⏱',nome:'Tempo de Montagem',desc:'1 hora antes e 1 hora após o evento inclusas para setup de itens externos e desmontagem. Horas adicionais via add-on.'},
];

const TECH_SPECS = [
  { cat:'Áudio & Palco', items:[
    'PA principal com potência calibrada para 100 pessoas',
    'Monitor de palco (retorno) incluso',
    'Mesa de som digital',
    'Microfone com fio + sem fio (headset/bastão)',
    'Direct Input (DI) para instrumentos',
    'Palco fixo estruturado',
    'Subwoofer adicional — disponível como add-on',
  ]},
  { cat:'Espaço & Capacidade', items:[

/* ── RENDER ────────────────────────────────────────────────────── */

function packHTML(p){
  return `
    <div class="pack" style="--pc:${p.pc}">
      <div class="pack-icon">${p.icon}</div>
      <div class="pack-nome">${p.nome}</div>
      <div class="pack-desc">${p.desc}</div>
      <div class="pack-inclui">
        <div class="pi-l">Incluso</div>
        ${p.inclui.map(i=>`
          <div class="pi-item">
            <div class="pi-d" style="background:${p.pc}"></div>
            <span class="pi-t">${i}</span>
          </div>`).join('')}
      </div>
      <div class="pack-preco">
        <div class="pp-l">Referência de Preço</div>
        <div class="pp-grid">
          ${p.precos.map(pr=>`
            <div class="pp-item">
              <div class="pp-dia">${pr.dia}</div>
              <div class="pp-val ${pr.modelo?'modelo':''}">${pr.val}</div>
              ${pr.modelo?'<div class="pp-flag">modelo *</div>':''}
            </div>`).join('')}
        </div>
      </div>
      <div class="pack-tag" style="color:${p.pc};border-color:${p.pc}">◈ ${p.persona} · ${p.tag}</div>
      <div class="pack-why">${p.why}</div>
    </div>`;
}

      <div class="er-c">

        <div class="er-entrada">${e.entrada}</div>
        <div class="er-txt">${e.porque}</div>
      </div>
      <div class="er-c">
        <div class="er-l">Expansão natural</div>
        <div class="er-exp">${e.expansao}</div>
      </div>
    </div>`).join('');

  document.getElementById('tab-pacotes').innerHTML=`
    <div class="insight">
      <div class="ins-l">Arquitetura do portfólio</div>
      <div class="ins-t">O Carro Chefe não vende locação — vende ocasião. A diferença está em como cada tipo de evento é apresentado, para quem e com qual argumento. Esta hierarquia foi definida por frequência, ticket, potencial de recorrência e fit com a infraestrutura atual do espaço.</div>

      <div class="tier-line"></div>
    </div>
    <div class="pack-grid cols2">${t2.map(packHTML).join('')}</div>

    <div style="font-size:9px;color:var(--cinza);font-style:italic;margin-bottom:40px;padding-left:4px">
      * Valores marcados como "modelo" são referências de mercado sugeridas para espaços de evento em São Paulo/Zona Leste. Aguardando confirmação do Carro Chefe para inserir os valores reais na tabela oficial.

/* ── INTERACTION ─────────────────────────────────────────────── */

function togAddon(i){
  document.getElementById('adb-'+i).classList.toggle('open');
  document.getElementById('adh-'+i).classList.toggle('open');
}

function goTab(id, btn){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.tb').forEach(b=>b.classList.remove('on'));
  document.getElementById('tab-'+id).classList.add('on');
  btn.classList.add('on');
  window.scrollTo({top:65,behavior:'smooth'});
}
